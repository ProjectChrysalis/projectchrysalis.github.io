<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Connecting Google Drive</title>
<link rel="icon" href="logo.png">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; }
  main { max-width: 26rem; padding: 1.5rem; text-align: center; }
  a.button { display: inline-block; margin-top: 0.75rem; padding: 0.6rem 1rem; border-radius: 0.5rem; background: CanvasText; color: Canvas; text-decoration: none; }
</style>
</head>
<body>
<main>
  <p id="message">Returning to Chrysalis…</p>
  <a id="go" class="button" hidden>Continue</a>
</main>
<script>
  // Google sends every Chrysalis back here, since each one has its own
  // address. The address it came from rides in `state`; the code is only
  // usable by the engine that holds the matching verifier.
  (function () {
    var q = new URLSearchParams(location.search);
    var message = document.getElementById("message");
    var origin = null;
    try {
      var o = JSON.parse(atob((q.get("state") || "").replace(/-/g, "+").replace(/_/g, "/"))).o;
      if (typeof o === "string" && /^https?:\/\/[^\s/?#]+$/.test(o)) origin = new URL(o);
    } catch (e) { /* not from Chrysalis */ }
    if (!origin) {
      message.textContent = "This page finishes connecting Google Drive to Chrysalis. Start from Settings > Backups in Chrysalis.";
      return;
    }
    var back = new URL("/v1/account/drive/callback", origin);
    ["code", "state", "error"].forEach(function (k) { if (q.has(k)) back.searchParams.set(k, q.get(k)); });
    history.replaceState(null, "", location.pathname);
    // this computer or the home network: go straight back. Anywhere else,
    // show where the sign-in is going first.
    var h = origin.hostname;
    var near = h === "localhost" || h === "[::1]" || /\.local$/.test(h) || /^(127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h);
    if (near) {
      location.replace(back.toString());
      return;
    }
    message.textContent = "Finish connecting Google Drive to Chrysalis at " + origin.host + "?";
    var go = document.getElementById("go");
    go.href = back.toString();
    go.textContent = "Continue to " + origin.host;
    go.hidden = false;
  })();
</script>
</body>
</html>
